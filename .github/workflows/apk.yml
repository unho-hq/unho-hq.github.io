name: APK de Albaranes

# Builds the Android app (a Trusted Web Activity around https://unho-hq.github.io/albaranes/)
# and publishes it as the download of the "android" release.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Firma
        run: echo "${{ secrets.FIRMA_P12_B64 }}" | base64 -d > android/app/firma.p12
      - name: Compilar
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk albaranes.apk
          gh release delete android --yes --cleanup-tag || true
          gh release create android albaranes.apk --title "Albaranes para Android" \
            --notes "Instala este APK en el móvil (Android 5 o superior). Versión 0.1.${{ github.run_number }}." --latest
